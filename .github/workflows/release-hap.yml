name: Release HarmonyOS HAP (oh23)

# 手动发布 workflow：不会自动运行。
# 使用方法：Actions 页面 → 本 workflow → Run workflow
#   - 选择分支（main / oh23）
#   - 填写版本号（如 1.0.4，不要带 v 前缀）
#   - （可选）勾选"标记为预发布版"
# 会自动完成：校验版本号 → 打 tag → 构建未签名 HAP → 上传到 GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 1.0.4，自动加 v 前缀作为 Release 标题，不要带 v）"
        required: true
        type: string
      prerelease:
        description: "标记为预发布版（Prerelease）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: harmonyos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish HAP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HARMONY_CLI_VERSION: 6.1.0.816
      HARMONY_CLI_ARCHIVE: commandline-tools-linux-x64-6.1.0.816.zip
      HARMONY_CLI_SHA256: 4b21e8a4ce19fc7eb381425a570e936c80067b8a0bef9cdcfe8a49e4764038e2
      HARMONY_CLI_URL: https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-6.1.0.816/commandline-tools-linux-x64-6.1.0.816.zip
      HARMONY_CLI_DIR: ${{ github.workspace }}/.harmony-cli
      HARMONY_CLI_HOME: ${{ github.workspace }}/.harmony-cli/command-line-tools

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "18.20.1"
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache HarmonyOS command-line tools
        id: cache-harmony-cli
        uses: actions/cache@v6
        with:
          path: ${{ env.HARMONY_CLI_DIR }}
          key: harmonyos-cli-linux-x64-${{ env.HARMONY_CLI_VERSION }}-${{ env.HARMONY_CLI_SHA256 }}

      - name: Download HarmonyOS command-line tools
        if: steps.cache-harmony-cli.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP}/${HARMONY_CLI_ARCHIVE}"
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            "${HARMONY_CLI_URL}" \
            --output "${archive_path}"
          echo "${HARMONY_CLI_SHA256}  ${archive_path}" | sha256sum --check --strict
          rm -rf "${HARMONY_CLI_DIR}"
          mkdir -p "${HARMONY_CLI_DIR}"
          unzip -q "${archive_path}" -d "${HARMONY_CLI_DIR}"
          rm -f "${archive_path}"

      - name: Configure HarmonyOS build tools
        shell: bash
        run: |
          set -euo pipefail
          test -d "${HARMONY_CLI_HOME}/bin"
          test -d "${HARMONY_CLI_HOME}/sdk"
          chmod -R u+x "${HARMONY_CLI_HOME}/bin"
          echo "${HARMONY_CLI_HOME}/bin" >> "${GITHUB_PATH}"
          node_home="$(dirname "$(dirname "$(command -v node)")")"
          {
            echo "DEVECO_NODE_HOME=${node_home}"
            echo "DEVECO_SDK_HOME=${HARMONY_CLI_HOME}"
            echo "OHPM_HOME=${HARMONY_CLI_HOME}/ohpm"
            echo "HOS_SDK_HOME=${HARMONY_CLI_HOME}/sdk"
          } >> "${GITHUB_ENV}"
          {
            echo "hwsdk.dir=${HARMONY_CLI_HOME}/sdk"
            echo "sdk.dir=${HARMONY_CLI_HOME}/sdk"
          } > local.properties

      - name: Verify HarmonyOS build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v ohpm
          command -v hvigorw
          node --version
          java -version
          ohpm --version

      - name: Install dependencies
        shell: bash
        run: ohpm install

      - name: Build unsigned HAP
        shell: bash
        run: hvigorw --mode project -p product=unsigned -p buildMode=release assembleApp --no-daemon

      - name: Locate HAP artifacts
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t haps < <(find . -path '*/build/*/outputs/*/*.hap' -type f | sort)
          test "${#haps[@]}" -gt 0 || { echo "::error::no .hap file found in build outputs"; exit 1; }
          for h in "${haps[@]}"; do
            echo "found hap: ${h}"
          done
          printf '%s\n' "${haps[@]}" > "${RUNNER_TEMP}/haps.txt"
          echo "count=${#haps[@]}" >> "${GITHUB_OUTPUT}"

      - name: Validate version and create git tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(printf '%s' "${{ inputs.version }}" | tr -d '[:space:]' | sed -E 's/^v//')"
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.+-]+)?$'; then
            echo "::error::invalid version format: ${version} (expected like 1.0.4)"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_ENV}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${version}" >/dev/null 2>&1; then
            echo "::error::tag '${version}' already exists, delete it or pick another version"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${version}" \
            -f sha="${GITHUB_SHA}"
          echo "tag refs/tags/${version} -> ${GITHUB_SHA} created"

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t haps < "${RUNNER_TEMP}/haps.txt"
          release_args=()
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            release_args+=(--prerelease)
          fi
          gh release create "${version}" "${haps[@]}" \
            --title "v${version}" \
            --generate-notes \
            "${release_args[@]}"
          echo "release v${version} published with ${#haps[@]} asset(s)"
