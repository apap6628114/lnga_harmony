name: Build HarmonyOS HAP (main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmonyos-hap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned HAP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HARMONY_CLI_VERSION: 26.0.0.621
      HARMONY_CLI_ARCHIVE: commandline-tools-linux-x64-26.0.0.621.zip
      HARMONY_CLI_SHA256: 0cea7ad6cc1af98ac701b9c61b7c9aae2d0f2104749a80ae84c1f6ca0fc17555
      HARMONY_CLI_URL: https://contentcenter-vali-drcn.dbankcdn.cn/pvt_2/DeveloperAlliance_package_901_9/95/v3/ksUKbWstTiqarw0qRRlIXQ/commandline-tools-linux-x64-26.0.0.621.zip?HW-CC-KV=V1&HW-CC-Date=20260809T124905Z&HW-CC-Expire=315360000&HW-CC-Sign=BE9B7BE8C24924FB98759EE199DA7188B881F4ABD19CE254F29E554AEC7E358B
      HARMONY_CLI_DIR: ${{ github.workspace }}/.harmony-cli
      HARMONY_CLI_HOME: ${{ github.workspace }}/.harmony-cli/command-line-tools

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.1"
          package-manager-cache: false

      - name: Check line endings (LF enforced)
        shell: bash
        run: node scripts/check-eol.mjs

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache HarmonyOS command-line tools
        id: cache-harmony-cli
        uses: actions/cache@v6
        with:
          path: ${{ env.HARMONY_CLI_DIR }}
          key: harmonyos-cli-linux-x64-${{ env.HARMONY_CLI_VERSION }}-${{ env.HARMONY_CLI_SHA256 }}

      - name: Download HarmonyOS command-line tools
        if: steps.cache-harmony-cli.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP}/${HARMONY_CLI_ARCHIVE}"
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            "${HARMONY_CLI_URL}" \
            --output "${archive_path}"
          echo "${HARMONY_CLI_SHA256}  ${archive_path}" | sha256sum --check --strict
          rm -rf "${HARMONY_CLI_DIR}"
          mkdir -p "${HARMONY_CLI_DIR}"
          unzip -q "${archive_path}" -d "${HARMONY_CLI_DIR}"
          rm -f "${archive_path}"

      - name: Configure HarmonyOS build tools
        shell: bash
        run: |
          set -euo pipefail
          test -d "${HARMONY_CLI_HOME}/bin"
          test -d "${HARMONY_CLI_HOME}/sdk"
          chmod -R u+x "${HARMONY_CLI_HOME}/bin"
          echo "${HARMONY_CLI_HOME}/bin" >> "${GITHUB_PATH}"
          node_home="$(dirname "$(dirname "$(command -v node)")")"
          {
            echo "DEVECO_NODE_HOME=${node_home}"
            echo "DEVECO_SDK_HOME=${HARMONY_CLI_HOME}"
            echo "OHPM_HOME=${HARMONY_CLI_HOME}/ohpm"
            echo "HOS_SDK_HOME=${HARMONY_CLI_HOME}/sdk"
          } >> "${GITHUB_ENV}"
          {
            echo "hwsdk.dir=${HARMONY_CLI_HOME}/sdk"
            echo "sdk.dir=${HARMONY_CLI_HOME}/sdk"
          } > local.properties

      - name: Verify HarmonyOS build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v ohpm
          command -v hvigorw
          node --version
          java -version
          ohpm --version

      - name: Install dependencies
        shell: bash
        run: ohpm install

      - name: Build unsigned HAP
        shell: bash
        run: hvigorw --mode project -p product=unsigned -p buildMode=release assembleApp --no-daemon

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v7
        with:
          name: nga-harmony-hap
          path: "**/build/**/outputs/**/*.hap"
          if-no-files-found: error
          retention-days: 14
